<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(220, 25%, 98%)"/>
      <stop offset="100%" stop-color="hsl(220, 20%, 94%)"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="80" y="80" width="352" height="352" rx="48" fill="hsl(160, 55%, 65%)" opacity="0.15"/>
  <!-- 日历图标 -->
  <rect x="100" y="100" width="312" height="312" rx="40" fill="none" stroke="hsl(160, 55%, 55%)" stroke-width="20"/>
  <line x1="100" y1="192" x2="412" y2="192" stroke="hsl(160, 55%, 55%)" stroke-width="16"/>
  <!-- 日历挂钩 -->
  <rect x="160" y="68" width="40" height="35" rx="10" fill="hsl(160, 55%, 55%)"/>
  <rect x="312" y="68" width="40" height="35" rx="10" fill="hsl(160, 55%, 55%)"/>
  <!-- 课程表文字 -->
  <text x="256" y="300" text-anchor="middle" font-family="sans-serif" font-size="55" font-weight="700" fill="hsl(160, 55%, 40%)">课程表</text>
  <text x="256" y="365" text-anchor="middle" font-family="sans-serif" font-size="26" fill="hsl(160, 40%, 50%)">24届网工7班</text>
</svg>
